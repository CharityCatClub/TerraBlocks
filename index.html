		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
// Block Jai v1.59 iOS/Safari memory guard. Godot Web historically declares
// a very large WebAssembly maximum; Mobile Safari can kill the WebContent
// process under memory pressure even when actual game state is tiny. Clamp
// only the declared maximum to 256 MiB (4096 WASM pages). If Godot ever needs
// a larger initial heap, preserve that initial size rather than creating an
// invalid descriptor.
(function(){
  try {
    var NativeMemory = WebAssembly.Memory;
    var MAX_PAGES = 4096;
    WebAssembly.Memory = function(desc){
      if (desc && typeof desc === 'object') {
        var copy = Object.assign({}, desc);
        var initial = Number(copy.initial || 0);
        if (typeof copy.maximum === 'number' && copy.maximum > MAX_PAGES) {
          copy.maximum = Math.max(MAX_PAGES, initial);
        }
        return new NativeMemory(copy);
      }
      return new NativeMemory(desc);
    };
    WebAssembly.Memory.prototype = NativeMemory.prototype;
  } catch (e) { console.warn('Block Jai WASM memory guard unavailable', e); }
})();
</script>
<script>
// Block Jai V1.267 Web score-flight compositor layer.
// Thermal purpose: preserve the smooth post-placement bubble while keeping the
// browser compositing surface tightly bounded around the moving bubbles instead
// of allocating a full-screen fixed layer for every placement.
(function(){
  'use strict';
  var generation = 0;
  var root = null;

  function clear(){
    generation++;
    if (root && root.parentNode) root.parentNode.removeChild(root);
    root = null;
  }

  function scoreFx(data){
    try {
      if (!data || !Array.isArray(data.components) || data.components.length === 0) return false;
      if (!Element.prototype.animate) return false;
      var canvas = document.getElementById('canvas') || document.querySelector('canvas');
      if (!canvas) return false;
      var rect = canvas.getBoundingClientRect();
      if (!(rect.width > 1 && rect.height > 1)) return false;

      clear();
      var myGeneration = generation;
      var logicalW = Math.max(1, Number(data.logical_w) || 540);
      var logicalH = Math.max(1, Number(data.logical_h) || 960);
      var sx = rect.width / logicalW;
      var sy = rect.height / logicalH;
      var scale = Math.min(sx, sy);
      var duration = Math.max(250, Number(data.duration_ms) || 1750);
      var totalW = Math.max(1, Number(data.total_width) || 46) * sx;
      var gap = Math.max(0, Number(data.gap) || 8) * sx;
      var startX = rect.left + (Number(data.start_x) || logicalW * 0.5) * sx;
      var startY = rect.top + (Number(data.start_y) || logicalH * 0.5) * sy;
      var targetX = rect.left + (Number(data.target_x) || 130) * sx;
      var targetY = rect.top + (Number(data.target_y) || 105) * sy;
      var maxBubbleH = 58 * sy;
      var pad = Math.max(6, 10 * scale);

      // V1.267: this group itself is the only overlay surface. Its raster/composite
      // bounds are close to the bubbles instead of the entire game viewport.
      var group = document.createElement('div');
      root = group;
      group.setAttribute('aria-hidden', 'true');
      Object.assign(group.style, {
        position: 'fixed',
        left: (startX - totalW * 0.5 - pad) + 'px',
        top: (startY - maxBubbleH * 0.5 - pad) + 'px',
        width: (totalW + pad * 2) + 'px',
        height: (maxBubbleH + pad * 2) + 'px',
        boxSizing: 'border-box',
        paddingLeft: pad + 'px',
        paddingRight: pad + 'px',
        display: 'flex',
        gap: gap + 'px',
        alignItems: 'center',
        overflow: 'visible',
        pointerEvents: 'none',
        userSelect: 'none',
        touchAction: 'none',
        zIndex: '2147483000',
        opacity: '0',
        willChange: 'transform, opacity',
        transform: 'translate3d(0,0,0)',
        contain: 'layout style',
      });
      document.body.appendChild(group);

      var light = !!data.light;
      var textColor = String(data.text_color || (light ? '#111a22' : '#eef5fb'));
      data.components.forEach(function(component, i){
        var detail = String(component.detail || '');
        var width = Math.max(34, Number(component.width) || 46) * sx;
        var heightLogical = detail ? 52 : 38;
        var height = heightLogical * sy;
        var accent = String(component.accent || '#7de4ff');
        var bubble = document.createElement('div');
        Object.assign(bubble.style, {
          position: 'relative',
          flex: '0 0 auto',
          width: width + 'px',
          height: height + 'px',
          boxSizing: 'border-box',
          borderRadius: Math.max(7, 16 * scale) + 'px',
          border: Math.max(1, scale) + 'px solid ' + accent,
          background: light ? 'rgba(255,255,255,0.94)' : 'rgba(6,12,17,0.88)',
          boxShadow: '0 ' + Math.max(1, 3 * scale) + 'px ' + Math.max(2, 7 * scale) + 'px rgba(0,0,0,' + (light ? '0.10' : '0.28') + ')',
          color: textColor,
          fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
          fontWeight: '800',
          textAlign: 'center',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          lineHeight: '1',
          willChange: 'transform',
          transform: 'translate3d(0,0,0)',
        });

        var label = document.createElement('div');
        label.textContent = String(component.label || '');
        Object.assign(label.style, {
          maxWidth: '94%',
          whiteSpace: 'nowrap',
          overflow: 'hidden',
          textOverflow: 'clip',
          fontSize: Math.max(8, 15 * scale) + 'px',
          letterSpacing: '-0.01em',
        });
        bubble.appendChild(label);
        if (detail) {
          var sub = document.createElement('div');
          sub.textContent = detail;
          Object.assign(sub.style, {
            maxWidth: '94%',
            marginTop: Math.max(1, 3 * scale) + 'px',
            whiteSpace: 'nowrap',
            overflow: 'hidden',
            color: accent,
            fontSize: Math.max(7, 9 * scale) + 'px',
            fontWeight: '700',
          });
          bubble.appendChild(sub);
        }
        group.appendChild(bubble);

        var bob = (8 + (i % 2) * 2) * sy;
        bubble.animate([
          { transform: 'translate3d(0,0,0)', offset: 0 },
          { transform: 'translate3d(0,' + (-bob) + 'px,0)', offset: 0.29 },
          { transform: 'translate3d(0,0,0)', offset: 0.58 },
          { transform: 'translate3d(0,0,0)', offset: 1 },
        ], { duration: duration, easing: 'ease-in-out', fill: 'forwards' });
      });

      var dx = targetX - startX;
      var dy = targetY - startY;
      var flight = group.animate([
        { transform: 'translate3d(0,0,0)', opacity: 0, offset: 0 },
        { transform: 'translate3d(0,0,0)', opacity: 1, offset: 0.13 },
        { transform: 'translate3d(0,0,0)', opacity: 1, offset: 0.20 },
        { transform: 'translate3d(' + dx + 'px,' + dy + 'px,0)', opacity: 1, offset: 0.72 },
        { transform: 'translate3d(' + dx + 'px,' + dy + 'px,0)', opacity: 1, offset: 0.90 },
        { transform: 'translate3d(' + dx + 'px,' + dy + 'px,0)', opacity: 0, offset: 1 },
      ], {
        duration: duration,
        easing: 'cubic-bezier(0.22,0.61,0.36,1)',
        fill: 'forwards'
      });
      flight.onfinish = function(){
        if (root === group && myGeneration === generation) clear();
      };
      return true;
    } catch (e) {
      console.warn('Block Jai score compositor unavailable', e);
      clear();
      return false;
    }
  }

  window.__block_jai_score_fx = scoreFx;
  window.__block_jai_score_fx_clear = clear;
})();
</script>

			<div id="status-notice"></div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":20982016,"index.wasm":37896978},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
