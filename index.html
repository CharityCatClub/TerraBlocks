		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
// MonsterBlocks v1.59 iOS/Safari memory guard. Godot Web historically declares
// a very large WebAssembly maximum; Mobile Safari can kill the WebContent
// process under memory pressure even when actual game state is tiny. Clamp
// only the declared maximum to 256 MiB (4096 WASM pages). If Godot ever needs
// a larger initial heap, preserve that initial size rather than creating an
// invalid descriptor.
(function(){
  try {
    var NativeMemory = WebAssembly.Memory;
    var MAX_PAGES = 4096;
    WebAssembly.Memory = function(desc){
      if (desc && typeof desc === 'object') {
        var copy = Object.assign({}, desc);
        var initial = Number(copy.initial || 0);
        if (typeof copy.maximum === 'number' && copy.maximum > MAX_PAGES) {
          copy.maximum = Math.max(MAX_PAGES, initial);
        }
        return new NativeMemory(copy);
      }
      return new NativeMemory(desc);
    };
    WebAssembly.Memory.prototype = NativeMemory.prototype;
  } catch (e) { console.warn('MonsterBlocks WASM memory guard unavailable', e); }
})();
</script>
<script>
// MonsterBlocks V1.265 Web score-flight compositor layer.
// Thermal purpose: keep the smooth post-placement bubble outside the Godot/WebGL
// presentation loop so a static game scene can return to true idle immediately.
(function(){
  'use strict';
  var generation = 0;
  var root = null;

  function clear(){
    generation++;
    if (root && root.parentNode) root.parentNode.removeChild(root);
    root = null;
  }

  function scoreFx(data){
    try {
      if (!data || !Array.isArray(data.components) || data.components.length === 0) return false;
      if (!Element.prototype.animate) return false;
      var canvas = document.getElementById('canvas') || document.querySelector('canvas');
      if (!canvas) return false;
      var rect = canvas.getBoundingClientRect();
      if (!(rect.width > 1 && rect.height > 1)) return false;

      clear();
      var myGeneration = generation;
      var logicalW = Math.max(1, Number(data.logical_w) || 540);
      var logicalH = Math.max(1, Number(data.logical_h) || 960);
      var sx = rect.width / logicalW;
      var sy = rect.height / logicalH;
      var scale = Math.min(sx, sy);
      var duration = Math.max(250, Number(data.duration_ms) || 1750);

      var layer = document.createElement('div');
      root = layer;
      layer.setAttribute('aria-hidden', 'true');
      Object.assign(layer.style, {
        position: 'fixed',
        left: rect.left + 'px',
        top: rect.top + 'px',
        width: rect.width + 'px',
        height: rect.height + 'px',
        overflow: 'hidden',
        pointerEvents: 'none',
        userSelect: 'none',
        touchAction: 'none',
        zIndex: '2147483000',
        contain: 'layout paint style',
      });

      var group = document.createElement('div');
      var totalW = Math.max(1, Number(data.total_width) || 46) * sx;
      var gap = Math.max(0, Number(data.gap) || 8) * sx;
      var startX = (Number(data.start_x) || logicalW * 0.5) * sx;
      var startY = (Number(data.start_y) || logicalH * 0.5) * sy;
      var targetX = (Number(data.target_x) || 130) * sx;
      var targetY = (Number(data.target_y) || 105) * sy;
      Object.assign(group.style, {
        position: 'absolute',
        left: (startX - totalW * 0.5) + 'px',
        top: startY + 'px',
        height: '1px',
        display: 'flex',
        gap: gap + 'px',
        alignItems: 'flex-start',
        opacity: '0',
        willChange: 'transform, opacity',
        transform: 'translate3d(0,0,0)',
      });
      layer.appendChild(group);
      // Attach before starting Web Animations. This keeps Safari's document timeline
      // behavior deterministic and avoids a first-frame flash on detached elements.
      document.body.appendChild(layer);

      var light = !!data.light;
      var textColor = String(data.text_color || (light ? '#111a22' : '#eef5fb'));
      data.components.forEach(function(component, i){
        var detail = String(component.detail || '');
        var width = Math.max(34, Number(component.width) || 46) * sx;
        var heightLogical = detail ? 52 : 38;
        var height = heightLogical * sy;
        var accent = String(component.accent || '#7de4ff');
        var bubble = document.createElement('div');
        Object.assign(bubble.style, {
          position: 'relative',
          flex: '0 0 auto',
          width: width + 'px',
          height: height + 'px',
          marginTop: (-height * 0.5) + 'px',
          boxSizing: 'border-box',
          borderRadius: Math.max(7, 16 * scale) + 'px',
          border: Math.max(1, scale) + 'px solid ' + accent,
          background: light ? 'rgba(255,255,255,0.94)' : 'rgba(6,12,17,0.88)',
          boxShadow: '0 ' + Math.max(1, 3 * scale) + 'px ' + Math.max(2, 7 * scale) + 'px rgba(0,0,0,' + (light ? '0.10' : '0.28') + ')',
          color: textColor,
          fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
          fontWeight: '800',
          textAlign: 'center',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          lineHeight: '1',
          willChange: 'transform',
          transform: 'translate3d(0,0,0)',
        });

        var label = document.createElement('div');
        label.textContent = String(component.label || '');
        Object.assign(label.style, {
          maxWidth: '94%',
          whiteSpace: 'nowrap',
          overflow: 'hidden',
          textOverflow: 'clip',
          fontSize: Math.max(8, 15 * scale) + 'px',
          letterSpacing: '-0.01em',
        });
        bubble.appendChild(label);
        if (detail) {
          var sub = document.createElement('div');
          sub.textContent = detail;
          Object.assign(sub.style, {
            maxWidth: '94%',
            marginTop: Math.max(1, 3 * scale) + 'px',
            whiteSpace: 'nowrap',
            overflow: 'hidden',
            color: accent,
            fontSize: Math.max(7, 9 * scale) + 'px',
            fontWeight: '700',
          });
          bubble.appendChild(sub);
        }
        group.appendChild(bubble);

        var bob = (8 + (i % 2) * 2) * sy;
        bubble.animate([
          { transform: 'translate3d(0,0,0)', offset: 0 },
          { transform: 'translate3d(0,' + (-bob) + 'px,0)', offset: 0.29 },
          { transform: 'translate3d(0,0,0)', offset: 0.58 },
          { transform: 'translate3d(0,0,0)', offset: 1 },
        ], { duration: duration, easing: 'ease-in-out', fill: 'forwards' });
      });

      var dx = targetX - startX;
      var dy = targetY - startY;
      var flight = group.animate([
        { transform: 'translate3d(0,0,0)', opacity: 0, offset: 0 },
        { transform: 'translate3d(0,0,0)', opacity: 1, offset: 0.13 },
        { transform: 'translate3d(0,0,0)', opacity: 1, offset: 0.20 },
        { transform: 'translate3d(' + dx + 'px,' + dy + 'px,0)', opacity: 1, offset: 0.72 },
        { transform: 'translate3d(' + dx + 'px,' + dy + 'px,0)', opacity: 1, offset: 0.90 },
        { transform: 'translate3d(' + dx + 'px,' + dy + 'px,0)', opacity: 0, offset: 1 },
      ], {
        duration: duration,
        easing: 'cubic-bezier(0.22,0.61,0.36,1)',
        fill: 'forwards'
      });
      flight.onfinish = function(){
        if (root === layer && myGeneration === generation) clear();
      };
      return true;
    } catch (e) {
      console.warn('MonsterBlocks score compositor unavailable', e);
      clear();
      return false;
    }
  }

  window.__monsterblocks_score_fx = scoreFx;
  window.__monsterblocks_score_fx_clear = clear;
})();
</script>
<script>
// MonsterBlocks V1.266 Web regular-monster eye compositor.
// Pupils/blinks/eye-roll stay smooth in the browser compositor while the Godot
// WebGL scene remains idle. GDScript continues to own subjects and blink timing.
(function(){
  'use strict';
  var layer = null;
  var currentPayload = null;
  var subjects = new Map();
  var resizeBound = false;

  function canvasInfo(){
    var canvas = document.getElementById('canvas') || document.querySelector('canvas');
    if (!canvas) return null;
    var rect = canvas.getBoundingClientRect();
    if (!(rect.width > 1 && rect.height > 1)) return null;
    return {canvas:canvas, rect:rect};
  }

  function clear(){
    if (layer && layer.parentNode) layer.parentNode.removeChild(layer);
    layer = null;
    subjects.clear();
    currentPayload = null;
  }

  function makeEye(parent, centerX, centerY, lidX, lidY, data, sx, sy, scale, side){
    var pupilRadius = Math.max(1, Number(data.pupil_radius)||1.5) * scale;
    var pupil = document.createElement('div');
    Object.assign(pupil.style, {
      position:'absolute',
      left:(centerX*sx - pupilRadius)+'px',
      top:(centerY*sy - pupilRadius)+'px',
      width:(pupilRadius*2)+'px',
      height:(pupilRadius*2)+'px',
      borderRadius:'50%',
      background:'rgba(5,5,8,1)',
      pointerEvents:'none',
      willChange:'transform',
      transform:'translate3d(0,0,0)'
    });
    pupil.dataset.orbit = String(Math.max(0, Number(data.orbit_radius)||0) * scale);
    parent.appendChild(pupil);

    var halfWidth = Math.max(1, Number(data.lid_half_width)||2) * scale;
    var maxThickness = Math.max(1, Number(data.lid_max_thickness)||2) * scale;
    var lid = document.createElement('div');
    Object.assign(lid.style, {
      position:'absolute',
      left:(lidX*sx - halfWidth)+'px',
      top:(lidY*sy - maxThickness*0.5)+'px',
      width:(halfWidth*2)+'px',
      height:maxThickness+'px',
      borderRadius:Math.max(1,maxThickness*0.45)+'px',
      background:String(data.eyelid_color || '#16121d'),
      pointerEvents:'none',
      transformOrigin:'50% 50%',
      transform:'scaleY(0.001)',
      willChange:'transform'
    });
    var crease = document.createElement('div');
    Object.assign(crease.style, {
      position:'absolute', left:'8%', right:'8%', top:'50%', height:Math.max(1,scale)+'px',
      transform:'translateY(-50%)', background:'rgba(6,5,8,0.90)', opacity:'0',
      pointerEvents:'none'
    });
    lid.appendChild(crease);
    parent.appendChild(lid);
    return {pupil:pupil, lid:lid, crease:crease, side:side};
  }

  function rebuild(){
    if (!currentPayload || !Array.isArray(currentPayload.subjects)) return false;
    var info = canvasInfo();
    if (!info) return false;
    if (layer && layer.parentNode) layer.parentNode.removeChild(layer);
    subjects.clear();
    var rect = info.rect;
    var logicalW = Math.max(1, Number(currentPayload.logical_w)||540);
    var logicalH = Math.max(1, Number(currentPayload.logical_h)||960);
    var sx = rect.width/logicalW, sy = rect.height/logicalH, scale = Math.min(sx,sy);
    layer = document.createElement('div');
    layer.setAttribute('aria-hidden','true');
    Object.assign(layer.style, {
      position:'fixed', left:rect.left+'px', top:rect.top+'px', width:rect.width+'px', height:rect.height+'px',
      overflow:'hidden', pointerEvents:'none', userSelect:'none', touchAction:'none',
      zIndex:'2147482000', contain:'layout paint style'
    });
    currentPayload.subjects.forEach(function(data){
      var id = String(data.id || '');
      if (!id) return;
      var subject = document.createElement('div');
      subject.dataset.monsterId = id;
      Object.assign(subject.style,{position:'absolute',left:'0',top:'0',width:'100%',height:'100%',pointerEvents:'none'});
      var left = makeEye(subject, Number(data.lp_x)||0, Number(data.lp_y)||0, Number(data.le_x)||0, Number(data.le_y)||0, data, sx, sy, scale, 'left');
      var right = makeEye(subject, Number(data.rp_x)||0, Number(data.rp_y)||0, Number(data.re_x)||0, Number(data.re_y)||0, data, sx, sy, scale, 'right');
      layer.appendChild(subject);
      subjects.set(id,{el:subject,left:left,right:right});
    });
    document.body.appendChild(layer);
    return subjects.size > 0;
  }

  function sync(payload){
    try {
      currentPayload = payload || null;
      if (!currentPayload || !Array.isArray(currentPayload.subjects) || currentPayload.subjects.length===0){ clear(); return true; }
      if (!resizeBound){
        resizeBound = true;
        window.addEventListener('resize', function(){ if (currentPayload) rebuild(); }, {passive:true});
        window.addEventListener('orientationchange', function(){ setTimeout(function(){ if(currentPayload) rebuild(); }, 80); }, {passive:true});
      }
      return rebuild();
    } catch(e){ console.warn('MonsterBlocks monster eye sync failed', e); clear(); return false; }
  }

  function blink(ids){
    try {
      if (!layer || !Array.isArray(ids)) return false;
      ids.forEach(function(id){
        var subject = subjects.get(String(id));
        if (!subject) return;
        [subject.left,subject.right].forEach(function(eye){
          eye.lid.getAnimations().forEach(function(a){a.cancel();});
          eye.crease.getAnimations().forEach(function(a){a.cancel();});
          eye.lid.animate([
            {transform:'scaleY(0.001)',offset:0},
            {transform:'scaleY(1)',offset:0.30},
            {transform:'scaleY(1)',offset:0.56},
            {transform:'scaleY(0.001)',offset:1}
          ],{duration:180,easing:'ease-in-out'});
          eye.crease.animate([
            {opacity:0,offset:0},{opacity:0,offset:0.46},{opacity:1,offset:0.62},{opacity:0,offset:1}
          ],{duration:180,easing:'ease-in-out'});
        });
      });
      return true;
    } catch(e){ return false; }
  }

  function roll(duration){
    try {
      if (!layer) return false;
      var ms = Math.max(120, Number(duration)||600);
      subjects.forEach(function(subject){
        [subject.left,subject.right].forEach(function(eye){
          var r = Math.max(0, Number(eye.pupil.dataset.orbit)||0);
          if (!(r>0)) return;
          eye.pupil.getAnimations().forEach(function(a){a.cancel();});
          var frames=[{transform:'translate3d(0,0,0)',offset:0},{transform:'translate3d('+r+'px,0,0)',offset:0.18}];
          var segments=16;
          for(var i=1;i<=segments;i++){
            var t=i/segments;
            var angle=t*Math.PI*2;
            frames.push({transform:'translate3d('+(Math.cos(angle)*r)+'px,'+(Math.sin(angle)*r)+'px,0)',offset:0.18+t*0.64});
          }
          frames.push({transform:'translate3d(0,0,0)',offset:1});
          eye.pupil.animate(frames,{duration:ms,easing:'linear'});
        });
      });
      return true;
    } catch(e){ return false; }
  }

  window.__monsterblocks_monster_eyes_sync = sync;
  window.__monsterblocks_monster_eyes_blink = blink;
  window.__monsterblocks_monster_eyes_roll = roll;
  window.__monsterblocks_monster_eyes_clear = clear;
})();
</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":20663164,"index.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
